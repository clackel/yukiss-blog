# Yukiss Blog —— 前端静态文件 + /api 反向代理到 Spring Boot（127.0.0.1:4000）
# 由 deploy/remote-install.sh 安装到 /etc/nginx/sites-available/yukiss-blog
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/yukiss-blog;
    index index.html;

    # 头像、文章图片上传上限（后端限制 5MB，留出余量）
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 后端接口：proxy_pass 末尾的 / 会去掉 /api 前缀，后端路径无需改动
    # 上传文件也经由这里访问：/api/uploads/xxx.png -> 后端 /uploads/xxx.png
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端登录限流依赖真实客户端 IP（server.forward-headers-strategy: native）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite 构建产物文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：刷新 /community、/articles/12 等前端路由时返回 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
