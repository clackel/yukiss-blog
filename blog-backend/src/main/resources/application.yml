server:
  port: ${BLOG_SERVER_PORT:4000}

spring:
  datasource:
    url: '${BLOG_DB_URL:jdbc:mysql://localhost:3306/my_blog_db?serverTimezone=GMT%2B8}'
    username: ${BLOG_DB_USERNAME:root}
    password: '${BLOG_DB_PASSWORD:}'
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    dir: '${BLOG_UPLOAD_DIR:${user.dir}/../uploads}'
  jwt:
    secret: ${BLOG_JWT_SECRET:yukiss-dev-secret-change-me}
    expiration-hours: ${BLOG_JWT_EXPIRATION_HOURS:12}

logging:
  level:
    moon.yukiss: debug
