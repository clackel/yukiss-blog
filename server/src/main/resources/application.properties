server.port=${BLOG_SERVER_PORT:4000}

spring.datasource.url=${BLOG_DB_URL:jdbc:mysql://localhost:3306/my_blog_db?serverTimezone=GMT%2B8}
spring.datasource.username=${BLOG_DB_USERNAME:root}
spring.datasource.password=${BLOG_DB_PASSWORD:}

mybatis.configuration.map-underscore-to-camel-case=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=${BLOG_UPLOAD_DIR:${user.dir}/../uploads}
app.jwt.secret=${BLOG_JWT_SECRET:yukiss-dev-secret-change-me}
app.jwt.expiration-hours=${BLOG_JWT_EXPIRATION_HOURS:12}

logging.level.moon.yukiss=debug
