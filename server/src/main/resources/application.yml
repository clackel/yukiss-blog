server:
  port: ${BLOG_SERVER_PORT:4000}
  # 部署在 Nginx 等本机反向代理之后时，从 X-Forwarded-For 获取真实客户端 IP（登录限流依赖它）。
  # 只信任内网 / 本机代理转发的请求头，外部伪造的请求头会被忽略。
  forward-headers-strategy: native

spring:
  config:
    # 从启动目录（server/）读取本地 .env；系统环境变量优先级更高
    import: 'optional:file:.env[.properties]'
  datasource:
    url: '${BLOG_DB_URL:jdbc:mysql://localhost:3306/my_blog_db?createDatabaseIfNotExist=true&serverTimezone=GMT%2B8}'
    username: ${BLOG_DB_USERNAME:root}
    password: '${BLOG_DB_PASSWORD:}'
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: '${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}'
  upload:
    dir: '${BLOG_UPLOAD_DIR:${user.dir}/../uploads}'
  jwt:
    secret: ${BLOG_JWT_SECRET:yukiss-dev-secret-change-me}
    expiration-hours: ${BLOG_JWT_EXPIRATION_HOURS:12}
  email:
    dev-return-code: ${BLOG_EMAIL_DEV_RETURN_CODE:true}

logging:
  level:
    moon.yukiss: ${BLOG_LOG_LEVEL:debug}
